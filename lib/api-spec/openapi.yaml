openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AMY 施工管理 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: projects
  - name: customers
  - name: staff
  - name: quotes
  - name: invoices
  - name: costs
  - name: schedule
  - name: progress
  - name: vendorInvoices
  - name: vendorQuotes
  - name: Storage
  - name: ocr
  - name: users
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overview KPIs across all projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed across the workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }

  /dashboard/cost-pipeline:
    get:
      operationId: getCostPipeline
      tags: [dashboard]
      summary: Aggregated planned vs actual cost across active projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostPipelineItem" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ProjectStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectBody" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /projects/{id}/ledger:
    get:
      operationId: getProjectLedger
      tags: [projects]
      summary: Construction cost ledger summary for a project (planned vs actual)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLedger" }

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Current signed-in user (creates app_users row on first call; first user is auto-admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all app users (internal admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Approve / change role / rename a user (internal admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (internal admin only; cannot delete self)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      operationId: createEmployee
      tags: [employees]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmployeeBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }

  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmployeeBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
    delete:
      operationId: deleteEmployee
      tags: [employees]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Staff" }
    post:
      operationId: createStaff
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }

  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
    delete:
      operationId: deleteStaff
      tags: [staff]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quote" }
    post:
      operationId: createQuote
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuoteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    patch:
      operationId: updateQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuoteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      operationId: deleteQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /commissions:
    get:
      operationId: getCommissions
      tags: [commissions]
      summary: 月次の営業歩合・現場監督歩合・マネジメント報酬を担当者ごとに集計
      parameters:
        - in: query
          name: month
          required: true
          description: "対象月 (YYYY-MM)。請求書の sentAt がこの月内のものを集計"
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionMonthReport" }

  /cost-entries:
    get:
      operationId: listCostEntries
      tags: [costs]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostEntry" }
    post:
      operationId: createCostEntry
      tags: [costs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCostEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEntry" }

  /cost-entries/{id}:
    patch:
      operationId: updateCostEntry
      tags: [costs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCostEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEntry" }
    delete:
      operationId: deleteCostEntry
      tags: [costs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /schedule:
    get:
      operationId: listScheduleEntries
      tags: [schedule]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleEntry" }
    post:
      operationId: createScheduleEntry
      tags: [schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEntry" }

  /schedule/{id}:
    patch:
      operationId: updateScheduleEntry
      tags: [schedule]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEntry" }
    delete:
      operationId: deleteScheduleEntry
      tags: [schedule]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/phases:
    get:
      operationId: listProjectPhases
      tags: [phases]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectPhase" }
    post:
      operationId: createProjectPhase
      tags: [phases]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectPhaseBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPhase" }

  /project-phases/overview:
    get:
      operationId: listAllProjectPhases
      tags: [phases]
      summary: All phases across all projects (for attendance overview)
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PhaseOverview" }

  /project-phases/{id}:
    patch:
      operationId: updateProjectPhase
      tags: [phases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectPhaseBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPhase" }
    delete:
      operationId: deleteProjectPhase
      tags: [phases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /staff/assignments:
    get:
      operationId: listStaffAssignments
      tags: [staff]
      summary: All staff with their currently assigned projects (derived from schedule entries)
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAssignment" }

  /progress-logs:
    get:
      operationId: listProgressLogs
      tags: [progress]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgressLog" }
    post:
      operationId: createProgressLog
      tags: [progress]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProgressLogBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressLog" }

  /quotes/{id}/convert-to-invoice:
    post:
      operationId: convertQuoteToInvoice
      tags: [quotes]
      summary: Create an invoice from an existing quote (line items copied)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuoteToInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /quotes/{id}/import-to-ledger:
    post:
      operationId: importQuoteToLedger
      tags: [quotes]
      summary: Create planned cost entries on the ledger from quote line items
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportQuoteToLedgerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostEntry" }

  /vendor-invoices:
    get:
      operationId: listVendorInvoices
      tags: [vendorInvoices]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: staffId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [matched, unmatched] }
        - in: query
          name: paid
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VendorInvoice" }
    post:
      operationId: createVendorInvoice
      tags: [vendorInvoices]
      summary: Submit a craftsman invoice; auto-matched to a project by unit number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /vendor-invoices/{id}:
    delete:
      operationId: deleteVendorInvoice
      tags: [vendorInvoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /vendor-invoices/{id}/assign-staff:
    post:
      operationId: assignVendorInvoiceStaff
      tags: [vendorInvoices]
      summary: Assign or change the staff for an invoice (used when OCR vendor name didn't match a staff)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignVendorInvoiceStaffBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /vendor-invoices/{id}/mark-paid:
    post:
      operationId: markVendorInvoicePaid
      tags: [vendorInvoices]
      summary: 職人への振込済フラグを更新する
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkVendorInvoicePaidBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /vendor-invoices/{id}/match:
    post:
      operationId: matchVendorInvoice
      tags: [vendorInvoices]
      summary: Manually attach an unmatched invoice to a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchVendorInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /vendor-quotes:
    get:
      operationId: listVendorQuotes
      tags: [vendorQuotes]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: staffId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [matched, unmatched] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VendorQuote" }
    post:
      operationId: createVendorQuote
      tags: [vendorQuotes]
      summary: Submit a craftsman quote (想定原価); auto-matched to a project by unit number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorQuoteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorQuote" }

  /vendor-quotes/{id}:
    delete:
      operationId: deleteVendorQuote
      tags: [vendorQuotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /vendor-quotes/{id}/match:
    post:
      operationId: matchVendorQuote
      tags: [vendorQuotes]
      summary: Manually attach an unmatched quote to a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchVendorQuoteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorQuote" }

  /vendor-quotes/{id}/convert-to-invoice:
    post:
      operationId: convertVendorQuoteToInvoice
      tags: [vendorQuotes]
      summary: Create a 職人請求書 (vendor invoice) from an existing 職人見積書. Reuses vendor/staff/project/file. Adds an actual cost entry on the ledger (the original planned cost entry from the quote is left intact, so 計画 vs 実績 can both be tracked).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertVendorQuoteToInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [matched, unmatched] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Receipt" }
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Upload an expense receipt; auto-matched to a project by unit number when provided
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReceiptBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }

  /receipts/{id}:
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /receipts/{id}/match:
    post:
      operationId: matchReceipt
      tags: [receipts]
      summary: Manually attach an unmatched receipt to a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchReceiptBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }

  /ocr/extract:
    post:
      operationId: extractOcr
      tags: [ocr]
      summary: Extract structured fields from an uploaded receipt or vendor invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractOcrBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractOcrResponse" }

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for direct file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestUploadUrlBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" }

  /progress-logs/{id}:
    delete:
      operationId: deleteProgressLog
      tags: [progress]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    ProjectStatus:
      type: string
      enum: [estimating, contracted, in_progress, completed, archived]

    CostCategory:
      type: string
      enum: [material, subcontract, labor, expense, other]

    Customer:
      type: object
      required: [id, name, defaultProfitRate, defaultSalesCommissionRate, defaultSupervisorCommissionRate, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        contactName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        defaultProfitRate: { type: number, description: "規定利率 (%, 施工台帳の規定粗利額算出に使用)" }
        defaultSalesCommissionRate: { type: number, description: "営業歩合の規定値 (%, 案件作成時にプリフィル)" }
        defaultSupervisorCommissionRate: { type: number, description: "現場監督歩合の規定値 (%, 規定超過粗利に対する配分率)" }
        defaultSalesRep: { type: string, nullable: true, description: "担当営業の規定値" }
        defaultOtherSalesBonusRecipient: { type: string, nullable: true, description: "マネジメント報酬受取人の規定値" }
        defaultOtherSalesBonusRate: { type: number, nullable: true, description: "マネジメント報酬率の規定値 (%)" }
        createdAt: { type: string, format: date-time }

    CreateCustomerBody:
      type: object
      required: [name]
      properties:
        name: { type: string }
        contactName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        defaultProfitRate: { type: number, nullable: true }
        defaultSalesCommissionRate: { type: number, nullable: true }
        defaultSupervisorCommissionRate: { type: number, nullable: true }
        defaultSalesRep: { type: string, nullable: true }
        defaultOtherSalesBonusRecipient: { type: string, nullable: true }
        defaultOtherSalesBonusRate: { type: number, nullable: true }

    AppUser:
      type: object
      required: [id, clerkUserId, role, status, createdAt]
      properties:
        id: { type: string }
        clerkUserId: { type: string }
        email: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [internal, external] }
        status: { type: string, enum: [pending, approved] }
        approvedAt: { type: string, format: date-time, nullable: true }
        approvedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    UpdateUserBody:
      type: object
      properties:
        role: { type: string, enum: [internal, external] }
        status: { type: string, enum: [pending, approved] }
        displayName: { type: string, nullable: true }

    Staff:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, description: "職種 (大工/クロス/電気 など)" }
        phone: { type: string, nullable: true }
        dailyRate: { type: number, nullable: true, description: "日当 (円)" }
        company: { type: string, nullable: true }
        otherSalesBonusRate: { type: number, nullable: true, description: "(レガシー) 社員テーブルに移行済" }
        createdAt: { type: string, format: date-time }

    CreateStaffBody:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
        phone: { type: string, nullable: true }
        dailyRate: { type: number, nullable: true }
        company: { type: string, nullable: true }
        otherSalesBonusRate: { type: number, nullable: true }

    Employee:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, description: "営業 / 現場監督 / 事務 (自由入力可)" }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        otherSalesBonusRate: { type: number, nullable: true, description: "(レガシー / 未使用)" }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateEmployeeBody:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Project:
      type: object
      required: [id, name, status, customerId, customerName, contractAmount, plannedCost, actualCost, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true, description: "案件番号" }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        customerId: { type: string }
        customerName: { type: string }
        siteAddress: { type: string, nullable: true }
        unitNumber: { type: string, nullable: true, description: "マンション号室 (自動振分けキー)" }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        contractAmount: { type: number, description: "契約金額 (税抜, 円)" }
        plannedCost: { type: number, description: "予算原価合計" }
        actualCost: { type: number, description: "実績原価合計" }
        salesCommissionRate: { type: number, description: "営業歩合率 (%, 売上に対して)" }
        standardProfitRate: { type: number, description: "規定利率 (%, NULL時は顧客マスタから取得)" }
        supervisorCommissionRate: { type: number, description: "現場監督歩合 (%, 規定超過粗利に対する配分率)" }
        otherSalesBonusRecipient: { type: string, nullable: true, description: "マネジメント報酬の受取人 (社員名)。空欄なら対象外" }
        otherSalesBonusRate: { type: number, nullable: true, description: "マネジメント報酬率 (%) — 受取人が指定されているときのみ有効" }
        salesRep: { type: string, nullable: true, description: "担当営業" }
        siteSupervisor: { type: string, nullable: true, description: "担当現場監督" }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateProjectBody:
      type: object
      required: [name, customerId, status]
      properties:
        name: { type: string }
        code: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        customerId: { type: string }
        siteAddress: { type: string, nullable: true }
        unitNumber: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        contractAmount: { type: number }
        salesCommissionRate: { type: number, nullable: true }
        standardProfitRate: { type: number, nullable: true }
        supervisorCommissionRate: { type: number, nullable: true }
        otherSalesBonusRecipient: { type: string, nullable: true }
        otherSalesBonusRate: { type: number, nullable: true }
        salesRep: { type: string, nullable: true }
        siteSupervisor: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    UpdateProjectBody:
      type: object
      properties:
        name: { type: string }
        code: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        customerId: { type: string }
        siteAddress: { type: string, nullable: true }
        unitNumber: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        contractAmount: { type: number }
        salesCommissionRate: { type: number, nullable: true }
        standardProfitRate: { type: number, nullable: true }
        supervisorCommissionRate: { type: number, nullable: true }
        otherSalesBonusRecipient: { type: string, nullable: true }
        otherSalesBonusRate: { type: number, nullable: true }
        salesRep: { type: string, nullable: true }
        siteSupervisor: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    ConvertQuoteToInvoiceBody:
      type: object
      required: [invoiceNumber, issueDate]
      properties:
        invoiceNumber: { type: string }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }

    ImportQuoteToLedgerBody:
      type: object
      required: [category, entryDate]
      properties:
        category: { $ref: "#/components/schemas/CostCategory" }
        entryDate: { type: string, format: date }
        replaceExisting: { type: boolean, description: "既存の同案件の計画原価を全削除してから取込", default: false }

    VendorInvoice:
      type: object
      required: [id, vendorName, unitNumber, amount, invoiceDate, fileUrl, fileName, status, paid, uploadedAt]
      properties:
        id: { type: string }
        staffId: { type: string, nullable: true }
        staffName: { type: string, nullable: true }
        vendorName: { type: string, description: "OCR抽出の取引先名。staffに紐付けば一致" }
        projectId: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        costEntryId: { type: string, nullable: true }
        unitNumber: { type: string, description: "マンション号室" }
        amount: { type: number }
        invoiceDate: { type: string, format: date }
        fileUrl: { type: string, description: "objectPath (e.g. /objects/uploads/uuid)" }
        fileName: { type: string }
        quoteFileUrl: { type: string, nullable: true, description: "見積書から引き継いだPDFのobjectPath" }
        quoteFileName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [matched, unmatched] }
        paid: { type: boolean, description: "職人への振込済みかどうか" }
        paidAt: { type: string, format: date, nullable: true, description: "振込済にした日付。「職人振込済」サイドバーの月絞り込み基準" }
        uploadedAt: { type: string, format: date-time }

    MarkVendorInvoicePaidBody:
      type: object
      required: [paid]
      properties:
        paid: { type: boolean }
        paidAt: { type: string, format: date, nullable: true }

    CreateVendorInvoiceBody:
      type: object
      required: [vendorName, unitNumber, amount, invoiceDate, fileUrl, fileName]
      properties:
        vendorName: { type: string }
        staffId: { type: string, nullable: true }
        unitNumber: { type: string }
        amount: { type: number }
        invoiceDate: { type: string, format: date }
        fileUrl: { type: string }
        fileName: { type: string }
        quoteFileUrl: { type: string, nullable: true }
        quoteFileName: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    MatchVendorInvoiceBody:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }

    AssignVendorInvoiceStaffBody:
      type: object
      required: [staffId]
      properties:
        staffId: { type: string, nullable: true, description: "nullで未割当に戻す" }

    VendorQuote:
      type: object
      required: [id, vendorName, unitNumber, amount, quoteDate, fileUrl, fileName, status, uploadedAt]
      properties:
        id: { type: string }
        staffId: { type: string, nullable: true }
        staffName: { type: string, nullable: true }
        vendorName: { type: string }
        projectId: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        costEntryId: { type: string, nullable: true, description: "施工台帳に作成された想定原価のID" }
        unitNumber: { type: string }
        amount: { type: number, description: "見積合計（税込）" }
        quoteDate: { type: string, format: date }
        validUntil: { type: string, format: date, nullable: true }
        fileUrl: { type: string }
        fileName: { type: string }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [matched, unmatched] }
        uploadedAt: { type: string, format: date-time }

    CreateVendorQuoteBody:
      type: object
      required: [vendorName, unitNumber, amount, quoteDate, fileUrl, fileName]
      properties:
        vendorName: { type: string }
        staffId: { type: string, nullable: true }
        unitNumber: { type: string }
        amount: { type: number }
        quoteDate: { type: string, format: date }
        validUntil: { type: string, format: date, nullable: true }
        fileUrl: { type: string }
        fileName: { type: string }
        notes: { type: string, nullable: true }

    MatchVendorQuoteBody:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }

    ConvertVendorQuoteToInvoiceBody:
      type: object
      required: [invoiceDate]
      properties:
        invoiceDate: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }

    Receipt:
      type: object
      required: [id, vendor, amount, receiptDate, category, fileUrl, fileName, status, uploadedAt]
      properties:
        id: { type: string }
        projectId: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        costEntryId: { type: string, nullable: true }
        vendor: { type: string }
        unitNumber: { type: string, nullable: true }
        amount: { type: number }
        receiptDate: { type: string, format: date }
        category: { $ref: "#/components/schemas/CostCategory" }
        fileUrl: { type: string }
        fileName: { type: string }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [matched, unmatched] }
        uploadedAt: { type: string, format: date-time }

    CreateReceiptBody:
      type: object
      required: [vendor, amount, receiptDate, category, fileUrl, fileName]
      properties:
        vendor: { type: string }
        unitNumber: { type: string, nullable: true }
        amount: { type: number }
        receiptDate: { type: string, format: date }
        category: { $ref: "#/components/schemas/CostCategory" }
        fileUrl: { type: string }
        fileName: { type: string }
        notes: { type: string, nullable: true }

    MatchReceiptBody:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }

    ExtractOcrBody:
      type: object
      required: [objectPath, kind]
      properties:
        objectPath: { type: string, description: "/objects/uploads/uuid path" }
        contentType: { type: string, nullable: true }
        kind:
          type: string
          enum: [receipt, vendor_invoice]

    ExtractOcrResponse:
      type: object
      required: [vendor, amount, date, confidence, items]
      properties:
        vendor: { type: string, description: "店舗名 / 取引先 / 職人名" }
        amount: { type: number, description: "合計金額（税込）" }
        date: { type: string, description: "領収日 / 請求日 (YYYY-MM-DD)" }
        unitNumber: { type: string, nullable: true, description: "号室（記載があれば、単一物件の場合）" }
        notes: { type: string, nullable: true, description: "摘要・補足" }
        confidence:
          type: string
          enum: [high, medium, low]
        items:
          type: array
          description: "請求書が複数物件をまとめている場合の内訳行。1物件のみなら1件。領収書では空配列でも可"
          items:
            type: object
            required: [unitNumber, amount]
            properties:
              unitNumber: { type: string, description: "号室" }
              amount: { type: number, description: "この物件の金額" }
              description: { type: string, nullable: true, description: "作業内容や摘要" }
              date: { type: string, nullable: true, description: "個別の作業日 (YYYY-MM-DD)" }

    RequestUploadUrlBody:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }

    RequestUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/RequestUploadUrlBody" }

    ProjectPhase:
      type: object
      required: [id, projectId, name, startDate, endDate, status, sortOrder, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        staffId: { type: string, nullable: true }
        staffName: { type: string, nullable: true }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [planned, in_progress, done] }
        color: { type: string, nullable: true }
        sortOrder: { type: number }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateProjectPhaseBody:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [planned, in_progress, done] }
        staffId: { type: string, nullable: true }
        color: { type: string, nullable: true }
        sortOrder: { type: number }
        notes: { type: string, nullable: true }

    UpdateProjectPhaseBody:
      type: object
      properties:
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [planned, in_progress, done] }
        staffId: { type: string, nullable: true }
        color: { type: string, nullable: true }
        sortOrder: { type: number }
        notes: { type: string, nullable: true }

    PhaseOverview:
      type: object
      required: [phaseId, projectId, projectName, phaseName, startDate, endDate, status]
      properties:
        phaseId: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        phaseName: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        status: { type: string, enum: [planned, in_progress, done] }
        staffId: { type: string, nullable: true }
        staffName: { type: string, nullable: true }

    StaffAssignment:
      type: object
      required: [staffId, staffName, role, projects]
      properties:
        staffId: { type: string }
        staffName: { type: string }
        role: { type: string }
        company: { type: string, nullable: true }
        projects:
          type: array
          items:
            type: object
            required: [projectId, projectName, days, firstDate, lastDate]
            properties:
              projectId: { type: string }
              projectName: { type: string }
              unitNumber: { type: string, nullable: true }
              days: { type: integer }
              firstDate: { type: string, format: date }
              lastDate: { type: string, format: date }

    LineItem:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        description: { type: string }
        unit: { type: string, nullable: true }
        quantity: { type: number }
        unitPrice: { type: number }
        notes: { type: string, nullable: true, description: "備考" }

    Quote:
      type: object
      required: [id, projectId, quoteNumber, issueDate, items, subtotal, tax, total, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
