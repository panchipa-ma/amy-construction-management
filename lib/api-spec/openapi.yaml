openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AMY 施工管理 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: projects
  - name: customers
  - name: staff
  - name: quotes
  - name: invoices
  - name: costs
  - name: schedule
  - name: progress
  - name: vendorInvoices
  - name: Storage
  - name: ocr
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overview KPIs across all projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed across the workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }

  /dashboard/cost-pipeline:
    get:
      operationId: getCostPipeline
      tags: [dashboard]
      summary: Aggregated planned vs actual cost across active projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostPipelineItem" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ProjectStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectBody" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /projects/{id}/ledger:
    get:
      operationId: getProjectLedger
      tags: [projects]
      summary: Construction cost ledger summary for a project (planned vs actual)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLedger" }

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Staff" }
    post:
      operationId: createStaff
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }

  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
    delete:
      operationId: deleteStaff
      tags: [staff]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quote" }
    post:
      operationId: createQuote
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuoteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    patch:
      operationId: updateQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuoteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      operationId: deleteQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /cost-entries:
    get:
      operationId: listCostEntries
      tags: [costs]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostEntry" }
    post:
      operationId: createCostEntry
      tags: [costs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCostEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEntry" }

  /cost-entries/{id}:
    patch:
      operationId: updateCostEntry
      tags: [costs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCostEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEntry" }
    delete:
      operationId: deleteCostEntry
      tags: [costs]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /schedule:
    get:
      operationId: listScheduleEntries
      tags: [schedule]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleEntry" }
    post:
      operationId: createScheduleEntry
      tags: [schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEntry" }

  /schedule/{id}:
    patch:
      operationId: updateScheduleEntry
      tags: [schedule]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleEntryBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEntry" }
    delete:
      operationId: deleteScheduleEntry
      tags: [schedule]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/phases:
    get:
      operationId: listProjectPhases
      tags: [phases]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectPhase" }
    post:
      operationId: createProjectPhase
      tags: [phases]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectPhaseBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPhase" }

  /project-phases/{id}:
    patch:
      operationId: updateProjectPhase
      tags: [phases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectPhaseBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPhase" }
    delete:
      operationId: deleteProjectPhase
      tags: [phases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /staff/assignments:
    get:
      operationId: listStaffAssignments
      tags: [staff]
      summary: All staff with their currently assigned projects (derived from schedule entries)
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAssignment" }

  /progress-logs:
    get:
      operationId: listProgressLogs
      tags: [progress]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgressLog" }
    post:
      operationId: createProgressLog
      tags: [progress]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProgressLogBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressLog" }

  /quotes/{id}/convert-to-invoice:
    post:
      operationId: convertQuoteToInvoice
      tags: [quotes]
      summary: Create an invoice from an existing quote (line items copied)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuoteToInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /quotes/{id}/import-to-ledger:
    post:
      operationId: importQuoteToLedger
      tags: [quotes]
      summary: Create planned cost entries on the ledger from quote line items
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportQuoteToLedgerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostEntry" }

  /vendor-invoices:
    get:
      operationId: listVendorInvoices
      tags: [vendorInvoices]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: staffId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [matched, unmatched] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VendorInvoice" }
    post:
      operationId: createVendorInvoice
      tags: [vendorInvoices]
      summary: Submit a craftsman invoice; auto-matched to a project by unit number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /vendor-invoices/{id}:
    delete:
      operationId: deleteVendorInvoice
      tags: [vendorInvoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /vendor-invoices/{id}/assign-staff:
    post:
      operationId: assignVendorInvoiceStaff
      tags: [vendorInvoices]
      summary: Assign or change the staff for an invoice (used when OCR vendor name didn't match a staff)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignVendorInvoiceStaffBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /vendor-invoices/{id}/match:
    post:
      operationId: matchVendorInvoice
      tags: [vendorInvoices]
      summary: Manually attach an unmatched invoice to a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchVendorInvoiceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorInvoice" }

  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [matched, unmatched] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Receipt" }
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Upload an expense receipt; auto-matched to a project by unit number when provided
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReceiptBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }

  /receipts/{id}:
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /receipts/{id}/match:
    post:
      operationId: matchReceipt
      tags: [receipts]
      summary: Manually attach an unmatched receipt to a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchReceiptBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }

  /ocr/extract:
    post:
      operationId: extractOcr
      tags: [ocr]
      summary: Extract structured fields from an uploaded receipt or vendor invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractOcrBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractOcrResponse" }

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for direct file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestUploadUrlBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" }

  /progress-logs/{id}:
    delete:
      operationId: deleteProgressLog
      tags: [progress]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    ProjectStatus:
      type: string
      enum: [estimating, contracted, in_progress, completed, archived]

    CostCategory:
      type: string
      enum: [material, subcontract, labor, expense, other]

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        contactName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateCustomerBody:
      type: object
      required: [name]
      properties:
        name: { type: string }
        contactName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Staff:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, description: "職種 (大工/クロス/電気 など)" }
        phone: { type: string, nullable: true }
        dailyRate: { type: number, nullable: true, description: "日当 (円)" }
        company: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateStaffBody:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
        phone: { type: string, nullable: true }
        dailyRate: { type: number, nullable: true }
        company: { type: string, nullable: true }

    Project:
      type: object
      required: [id, name, status, customerId, customerName, contractAmount, plannedCost, actualCost, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true, description: "案件番号" }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        customerId: { type: string }
        customerName: { type: string }
        siteAddress: { type: string, nullable: true }
        unitNumber: { type: string, nullable: true, description: "マンション号室 (自動振分けキー)" }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
