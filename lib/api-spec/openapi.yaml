          type: array
          items: { $ref: "#/components/schemas/CostEntry" }

    LedgerCategoryRow:
      type: object
      required: [category, plannedAmount, actualAmount]
      properties:
        category: { $ref: "#/components/schemas/CostCategory" }
        plannedAmount: { type: number }
        actualAmount: { type: number }

    DashboardSummary:
      type: object
      required: [activeProjects, completedThisMonth, contractValueActive, plannedCostActive, actualCostActive, grossProfitActive, unpaidInvoiceTotal, billedProjectsCount, invoicedTotal, paidInvoiceTotal, statusBreakdown, monthlyInvoiceTotals, invoicesWithoutDueDate]
      properties:
        activeProjects: { type: integer }
        completedThisMonth: { type: integer }
        contractValueActive: { type: number }
        plannedCostActive: { type: number }
        actualCostActive: { type: number }
        grossProfitActive: { type: number }
        unpaidInvoiceTotal: { type: number }
        billedProjectsCount: { type: integer, description: "請求書が 1 件以上ある案件数 (請求中案件)" }
        invoicedTotal: { type: number, description: "全請求書の税込合計 (請求金額合計)" }
        paidInvoiceTotal: { type: number, description: "入金済請求書の税込合計 (入金済合計)" }
        statusBreakdown:
          type: array
          description: |
            Counts grouped by computed dashboard bucket. Buckets are not the
            raw project status enum; they are: estimating / in_progress /
            completed / billed / paid.
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        monthlyInvoiceTotals:
          type: array
          description: Invoice totals grouped by the month of the payment due date (支払期限).
          items:
            type: object
            required: [month, total, paidTotal, unpaidTotal, count]
            properties:
              month: { type: string, description: "YYYY-MM" }
              total: { type: number }
              paidTotal: { type: number }
              unpaidTotal: { type: number }
              count: { type: integer }
        invoicesWithoutDueDate:
          type: object
          required: [count, total]
          properties:
            count: { type: integer }
            total: { type: number }

